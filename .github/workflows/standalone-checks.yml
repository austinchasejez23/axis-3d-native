name: Standalone test isolation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate standalone guarantees
        run: npm run test:standalone
      - name: Lint source
        run: npm run lint
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Build web bundle
        if: always()
        run: npm run build

  modeling-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run ALL modeling regression scripts, collecting failures
        run: |
          status=0
          for test in scripts/*-regression.mjs; do
            echo "::group::$test"
            # The Boolean-edge boundary case has intermittently collapsed
            # a triangle after Float32 packing. Repeat across fresh Node/Vite
            # processes rather than trusting a single lucky passing run.
            trials=1
            if [ "$test" = "scripts/boolean-edge-regression.mjs" ]; then trials=3; fi
            for trial in $(seq 1 "$trials"); do
              echo "Running $test (trial $trial/$trials)"
              node "$test" || status=1
            done
            echo "::endgroup::"
          done
          exit "$status"

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build web assets and sync Capacitor
        run: npm run android:sync
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Compile Android debug build
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew --no-daemon assembleDebug
      - name: Prove release signing refuses missing key material
        run: |
          unset AXIS_UPLOAD_KEYSTORE AXIS_UPLOAD_STORE_PASSWORD AXIS_UPLOAD_KEY_PASSWORD AXIS_VERSION_CODE
          cd android
          if ./gradlew --no-daemon :app:verifyAxisUploadKey > signing-rejection.log 2>&1; then
            echo "::error::Release signing verification unexpectedly accepted missing credentials"
            exit 1
          fi
          grep -Fq 'Release signing requires AXIS_UPLOAD_KEYSTORE' signing-rejection.log || {
            echo "::error::Release signing failed for an unexpected reason"
            tail -n 15 signing-rejection.log
            exit 1
          }
          echo 'Release signing correctly rejected missing credentials.'
      - name: Ensure release signing rejects absent credentials
        run: |
          cd android
          if ./gradlew --no-daemon :app:verifyAxisUploadKey > signing-guard.log 2>&1; then
            echo "SECURITY FAILURE: release signing accepted missing credentials"
            exit 1
          fi
          grep -Fq 'Release signing requires AXIS_UPLOAD_KEYSTORE' signing-guard.log || {
            echo "Signing guard failed for an unexpected reason"
            tail -60 signing-guard.log
            exit 1
          }
          echo "Confirmed: release signing fails closed without private key material"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: standalone-axis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  baseline-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Check out original pre-migration commit
        uses: actions/checkout@v4
        with:
          ref: bc3e7ddf9255b6f45cc46cfd28e2a32836eea952
          path: before
      - name: Check out proposed migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: after
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install baseline and migration dependencies
        run: |
          npm ci --prefix before
          npm ci --prefix after
      - name: Run both original checks without altering their exit codes
        run: |
          set +e
          (cd before && node scripts/boolean-edge-regression.mjs) > before-boolean.log 2>&1
          echo "BASE_BOOLEAN=$?" >> "$GITHUB_ENV"
          (cd after && node scripts/boolean-edge-regression.mjs) > after-boolean.log 2>&1
          echo "AFTER_BOOLEAN=$?" >> "$GITHUB_ENV"
          (cd before && npm run typecheck) > before-typecheck.log 2>&1
          echo "BASE_TYPECHECK=$?" >> "$GITHUB_ENV"
          (cd after && npm run typecheck) > after-typecheck.log 2>&1
          echo "AFTER_TYPECHECK=$?" >> "$GITHUB_ENV"
      - name: Compare diagnostic messages and failures to original
        run: node after/scripts/compare-typecheck.mjs before-typecheck.log after-typecheck.log "$BASE_BOOLEAN" "$AFTER_BOOLEAN"
      - name: Attach independent baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-vs-migration-diagnostics
          path: |
            before-boolean.log
            after-boolean.log
            before-typecheck.log
            after-typecheck.log
            comparison.md
      - name: Put comparison into workflow summary
        if: always()
        run: if [ -f comparison.md ]; then cat comparison.md >> "$GITHUB_STEP_SUMMARY"; fi
