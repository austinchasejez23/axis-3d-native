name: Standalone test isolation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate standalone guarantees
        run: npm run test:standalone
      - name: Run modeling regression tests
        run: |
          for test in scripts/*-regression.mjs; do
            echo "Running $test"
            node "$test"
          done
      - name: Lint source
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build web bundle
        run: npm run build
      - name: Build isolated Android debug APK
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Compile Android debug build
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: standalone-axis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
