name: Android build

# Tap "Run workflow" on this file in the GitHub mobile app, or push to main.
# The debug APK needs no signing key: download it from the run's Artifacts and
# install it straight on the phone. The signed release bundle for Play is only
# built once the signing secrets exist.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: ubuntu-latest
    # Job level, so the `if` guards below can read it. A step's own `env` is
    # not in scope for that step's `if`.
    env:
      KEYSTORE_FILE_KEY: ${{ secrets.KEYSTORE_FILE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # @capacitor/cli 8.x declares engines.node >=22, and this is the version
      # the project is actually built and tested on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # versionCode has to climb on every Play upload, and the live listing is
      # on 24. run_number starts at 1, so the first build here is 25.
      - name: Set versionCode from the run number
        run: |
          CODE=$(( 24 + ${{ github.run_number }} ))
          echo "AXIS_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "AXIS_VERSION_NAME=$CODE.0" >> "$GITHUB_ENV"
          echo "versionCode $CODE"

      - name: Build the web app into the native project
        run: |
          npx vite build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Install the exact SDK pieces the project asks for. Gradle will not
      # always fetch a missing platform on its own, and compileSdk here is 36.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: axis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Everything below is skipped until the signing secrets are added.
      - name: Restore the upload keystore
        # android/upload.jks.enc is the upload keystore encrypted with AES-256.
        # Only the KEYSTORE_FILE_KEY secret can decrypt it.
        if: env.KEYSTORE_FILE_KEY != ''
        run: |
          printf '%s' "$KEYSTORE_FILE_KEY" | tr -d '[:space:]' > /tmp/axis-file-key
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in android/upload.jks.enc -out android/upload.jks -pass file:/tmp/axis-file-key
          rm -f /tmp/axis-file-key

      - name: Signed release bundle
        if: hashFiles('android/upload.jks') != ''
        env:
          AXIS_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AXIS_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AXIS_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          export AXIS_UPLOAD_KEYSTORE="$PWD/android/upload.jks"
          cd android && ./gradlew --no-daemon bundleRelease

      - name: Remove the restored keystore
        if: always()
        run: rm -f android/upload.jks

      - uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != ''
        with:
          name: axis-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
