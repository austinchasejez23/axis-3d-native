name: Android build

# Tap "Run workflow" on this file in the GitHub mobile app, or push to main.
# The debug APK needs no signing key: download it from the run's Artifacts and
# install it straight on the phone. The signed release bundle for Play is only
# built once the three signing secrets exist.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: ubuntu-latest
    # Job level, so the `if` guards below can read it. A step's own `env` is
    # not in scope for that step's `if`.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # @capacitor/cli 8.x declares engines.node >=22, and this is the version
      # the project is actually built and tested on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # versionCode has to climb on every Play upload, and the live listing is
      # on 24. run_number starts at 1, so the first build here is 25.
      - name: Set versionCode from the run number
        run: |
          CODE=$(( 24 + ${{ github.run_number }} ))
          sed -i "s/versionCode .*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$CODE.0\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build the web app into the native project
        run: |
          npx vite build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - name: Debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: axis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Everything below is skipped until the signing secrets are added.
      - name: Restore the upload keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks

      - name: Signed release bundle
        if: hashFiles('android/upload.jks') != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android && ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/upload.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != ''
        with:
          name: axis-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
